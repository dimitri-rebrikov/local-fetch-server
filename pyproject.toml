[project]
name = "local-fetch-server"
version = "1.0.0"
description = "A local MCP server for fetching and extracting web content"
authors = [
    { name = "dimitri-rebrikov", email = "dimitri@example.com" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "trafilatura>=1.12.0"
]

[project.urls]
Homepage = "https://github.com/dimitri-rebrikov/local-fetch-server"
Documentation = "https://github.com/dimitri-rebrikov/local-fetch-server"
Repository = "https://github.com/dimitri-rebrikov/local-fetch-server"
Issues = "https://github.com/dimitri-rebrikov/local-fetch-server/issues"

[project.scripts]
fetch-server = "fetch_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.6.0"
]

[tool.hatch.build.targets.wheel]
only-include = ["fetch_server.py"]